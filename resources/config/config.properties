# Configuration Properties
browser=chrome

# Set to true to run browser without UI (overridden automatically in CI pipelines)
headless=false

baseUrl=https://www.demoblaze.com
timeout=30
slowmo=1000

# Browser specific settings
viewport.width=1920
viewport.height=1080

# Test environment
environment=qa
test.data.path=src/test/resources/testdata

# Reporting
screenshots.on.failure=true
video.recording=true

# SpurQuality report upload - set to true to upload results after test execution
spurquality.report.enabled=false

# Allure reporting
allure.results.directory=target/allure-results
allure.report.directory=target/allure-report
